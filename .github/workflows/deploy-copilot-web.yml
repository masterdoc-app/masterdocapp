name: Deploy Web to VPS

on:
  push:
    branches: [trunk]
  workflow_dispatch:

concurrency:
  group: deploy-copilot-web-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  DEPLOY_HOST: 91.207.75.72
  DEPLOY_PATH: /opt/masterdoc-copilot
  WEB_ROOT: /var/www/copilot.fixaverse.ru
  SITE_HOST: copilot.fixaverse.ru
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    name: Build Wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout fixaverse-design (includeBuild, no Packages token)
        uses: actions/checkout@v4
        with:
          repository: masterdoc-app/fixaverse-design
          path: fixaverse-design

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: chmod +x gradlew

      - name: Prepare HTTPS API URL for web build
        run: echo "masterdoc.api.baseUrl=https://api.masterdoc.pro/v1" > local.properties

      # Unit tests must pass before Wasm artifact / deploy (same gate as ci.yml).
      - name: Unit & UI tests
        run: >
          ./gradlew :shared:jvmTest :composeApp:desktopTest
          :composeApp:compileKotlinWasmJs --stacktrace

      - name: Build Web distribution
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: wasm-dist
          path: composeApp/build/dist/wasmJs/productionExecutable/
          retention-days: 3

  deploy:
    name: Deploy to copilot.fixaverse.ru
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: wasm-dist
          path: dist/

      - name: Verify deploy secrets
        env:
          KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
        run: |
          test -n "$KEY" || { echo "Add repository secret DEPLOY_SSH_PRIVATE_KEY"; exit 1; }
          test -n "$USER_NAME" || { echo "Add repository secret DEPLOY_USER"; exit 1; }

      - name: Load SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_ed25519
          chmod 600 ~/.ssh/deploy_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Prepare directories on server
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "mkdir -p ${DEPLOY_PATH} ${WEB_ROOT}"

      - name: Rsync Wasm static site
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz --delete \
            -e "ssh -i $HOME/.ssh/deploy_ed25519 -o IdentitiesOnly=yes" \
            dist/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${WEB_ROOT}/"

      - name: Rsync nginx config and install script
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          rsync -avz \
            -e "ssh -i $HOME/.ssh/deploy_ed25519 -o IdentitiesOnly=yes" \
            deploy/copilot.fixaverse.ru.nginx.conf \
            deploy/copilot.fixaverse.ru.nginx.http.conf \
            deploy/copilot.masterdoc.pro.nginx.conf \
            deploy/copilot.masterdoc.pro.nginx.http.conf \
            deploy/install-copilot-nginx.sh \
            deploy/install-copilot-fixaverse-nginx.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"

      - name: Install nginx site and TLS
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          CERTBOT_EMAIL: ${{ secrets.CERTBOT_EMAIL }}
        run: |
          ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chmod +x ${DEPLOY_PATH}/install-copilot-nginx.sh && \
             DEPLOY_PATH='${DEPLOY_PATH}' CERTBOT_EMAIL='${CERTBOT_EMAIL:-admin@fixaverse.ru}' \
             SITE_HOST='${SITE_HOST}' \
             ${DEPLOY_PATH}/install-copilot-fixaverse-nginx.sh"

      - name: Smoke (HTTPS or localhost)
        env:
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          chmod +x scripts/smoke-copilot-web.sh
          ./scripts/smoke-copilot-web.sh "https://${SITE_HOST}" \
          || ssh -i "$HOME/.ssh/deploy_ed25519" -o IdentitiesOnly=yes \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "curl -fsS http://127.0.0.1/ -H 'Host: ${SITE_HOST}' | head -c 500; nginx -t; systemctl status nginx --no-pager | head -20"
