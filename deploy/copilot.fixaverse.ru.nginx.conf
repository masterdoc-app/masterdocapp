# copilot.fixaverse.ru — Wasm web app (HTTPS)
# Certs: certbot certonly --webroot -w /var/www/certbot -d copilot.fixaverse.ru

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name copilot.fixaverse.ru;

    ssl_certificate /etc/letsencrypt/live/copilot.fixaverse.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/copilot.fixaverse.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/copilot.fixaverse.ru;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/wasm application/json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.wasm$ {
        types { application/wasm wasm; }
        default_type application/wasm;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

server {
    listen 80;
    listen [::]:80;
    server_name copilot.fixaverse.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
